name: codex-pooler-dev

services:
  db:
    image: postgres:18
    init: true
    shm_size: "256mb"
    restart: unless-stopped
    # The default 100 connections is below what parallel partitions plus
    # concurrent agents need: runs die with FATAL 53300 mid-test, which reads
    # as an assert_receive timeout rather than as exhaustion.
    command:
      - "postgres"
      - "-c"
      - "max_connections=400"
    environment:
      POSTGRES_DB: codex_pooler_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      - codex-pooler-postgres:/var/lib/postgresql

volumes:
  codex-pooler-postgres:
